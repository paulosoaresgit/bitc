name: BTCPay checkout security
on:
  pull_request:
    paths:
      - 'api/**'
      - 'assets/bm-checkout.js'
      - 'deploy/hostinger/**'
      - '.github/workflows/btcpay-security.yml'
  push:
    branches:
      - 'fix/btcpay-server-pricing-checkout'
    paths:
      - 'api/**'
      - 'assets/bm-checkout.js'
      - '.github/workflows/btcpay-security.yml'
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check API and checkout
        run: |
          node --check api/server.js
          node --check api/order-utils.js
          node --check api/order-read.js
          node --check api/pixel-manager.js
          node --check assets/bitc-tracking.js
          node --check assets/bm-cart.js
          node --check assets/bm-checkout.js
      - name: Check Hostinger deployment scripts
        run: |
          bash -n deploy/hostinger/preflight.sh
          bash -n deploy/hostinger/publish.sh
          bash -n deploy/hostinger/check-prod.sh
          bash -n deploy/hostinger/setup-pixel-panel.sh
      - name: Validate Hostinger Docker Compose configuration
        shell: bash
        run: |
          sudo install -d -m 700 /etc/bitc
          printf 'BTCPAY_URL=https://pay.bitcmining.tech\nBTCPAY_API_KEY=CI_PLACEHOLDER\nBTCPAY_STORE_ID=CI_PLACEHOLDER\nBTCPAY_WEBHOOK_SECRET=CI_PLACEHOLDER\nBITC_SUPABASE_URL=https://example.supabase.co\nBITC_SUPABASE_SERVICE_KEY=CI_PLACEHOLDER\nBITC_CATALOG_JSON={}\n' | sudo tee /etc/bitc/bitc.env >/dev/null
          sudo chmod 600 /etc/bitc/bitc.env
          sudo env BTCPAY_PROXY_NETWORK=ci-proxy LETSENCRYPT_EMAIL=ci@example.com docker compose -f deploy/hostinger/docker-compose.yml config --quiet
      - name: Verify static tracking injection and admin isolation
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, tempfile, sys
          s=pathlib.Path('deploy/hostinger/publish.sh').read_text()
          marker='python3 - "$stage" <<\'PY\'\n'
          assert marker in s
          source=s.split(marker,1)[1].split('\nPY\n',1)[0]
          compile(source,'tracking-injection','exec')
          with tempfile.TemporaryDirectory() as folder:
              tmp=pathlib.Path(folder)
              (tmp/'checkout').mkdir()
              (tmp/'admin'/'pixels').mkdir(parents=True)
              (tmp/'products'/'sample').mkdir(parents=True)
              (tmp/'products'/'sample'/'index.html').write_text('<html><head></head><body><form method="post" action="/cart/add"><button name="add">Add To Cart</button></form></body></html>')
              (tmp/'index.html').write_text('<html><HEAD><title>Shop</title></HEAD><body>Demo</body></html>')
              (tmp/'checkout'/'index.html').write_text('<html><head></head><body>Pay</body></html>')
              (tmp/'admin'/'pixels'/'index.html').write_text('<html><head></head><body>Admin</body></html>')
              for _ in range(2):
                  subprocess.run([sys.executable,'-c',source,str(tmp)],check=True)
              assert (tmp/'index.html').read_text().count('src="/assets/bitc-tracking.js"')==1
              assert (tmp/'checkout'/'index.html').read_text().count('src="/assets/bitc-tracking.js"')==1
              assert 'bitc-tracking.js' not in (tmp/'admin'/'pixels'/'index.html').read_text()
              product=(tmp/'products'/'sample'/'index.html').read_text()
              assert product.count('src="/assets/bitc-product-purchase.js"')==1
              assert product.count('src="/assets/bm-cart.js"')==1
          print('PIXEL_BOOTSTRAP_AND_ADMIN_ISOLATION=OK')
          PY
      - name: Verify legacy tag stripping does not remove storefront pages
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,tempfile,sys
          with tempfile.TemporaryDirectory() as t:
              stage=pathlib.Path(t)
              for f in ['index.html','products/bitcoin-merch-bitaxe-601-gamma-power-supply-bitcoin-miner-1-5th-s/index.html']:
                  file=stage/f
                  file.parent.mkdir(parents=True,exist_ok=True)
                  file.write_bytes(pathlib.Path(f).read_bytes())
              subprocess.run([sys.executable,'deploy/hostinger/remove-legacy-tracking.py',str(stage)],check=True)
              for f in stage.rglob('*.html'):
                  text=f.read_text()
                  assert '<html' in text.lower()
                  assert 'GTM-W22X2BFR' not in text, 'legacy GTM remains in '+str(f)
                  if 'AW-807906555' in text:
                      i=text.find('AW-807906555')
                      print('REMAINING_OLD_ADS_CONTEXT='+repr(text[max(0,i-160):i+130]).replace('\\n',' '))
              print('LEGACY_TAGS_REMOVED_FROM_STAGE=OK')
          PY
      - name: Inspect canonical purchase form structure
        run: node api/audit-legacy-product-forms.mjs
      - name: Audit inherited tags before enabling marketing
        run: node api/audit-legacy-trackers.mjs
      - name: Verify prices and checkout security
        run: cd api && npm test
      - name: Inspect storefront catalog markup
        run: node api/generate-catalog.mjs --check
      - name: Audit product links before storefront launch
        run: node api/audit-site-links.mjs
      - name: Analyze captured collection cards
        run: |
          python -m pip install beautifulsoup4 -q
          python api/audit-product-cards.py
      - name: Lock merchant-approved prices and sold-out safeguards
        run: python api/verify-approved-price-fixes.py
      - name: Validate live product feed availability
        run: python api/audit-live-prices.py
