name: bitc-store
services:
  api:
    build:
      context: ../../api
    restart: unless-stopped
    env_file:
      - /etc/bitc/bitc.env
    environment:
      PORT: "10000"
      NODE_ENV: "production"
    expose:
      - "10000"
    networks:
      - bitc_private
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  storefront:
    image: nginx:1.27-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ${BITC_PUBLIC_DIR:-/opt/bitc/public}:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      # The installed BTCPay nginx-gen template requires a unique upstream name.
      VIRTUAL_HOST_NAME: "bitcstore"
      VIRTUAL_HOST: "bitcmining.tech,www.bitcmining.tech"
      LETSENCRYPT_HOST: "bitcmining.tech,www.bitcmining.tech"
      LETSENCRYPT_EMAIL: "${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL is required}"
      VIRTUAL_PORT: "80"
      VIRTUAL_NETWORK: "${BTCPAY_PROXY_NETWORK:?Set to the verified network of BTCPay nginx-proxy}"
    expose:
      - "80"
    networks:
      - bitc_private
      - btcpay_proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/checkout/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  bitc_private:
    driver: bridge
  btcpay_proxy:
    external: true
    name: "${BTCPAY_PROXY_NETWORK:?Set to the verified network of BTCPay nginx-proxy}"
